name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Kakitome.slnx -c Release -p:Platform=x64
      - name: Test
        run: dotnet test --solution Kakitome.slnx -c Release -p:Platform=x64 --no-build
